services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unichatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port 6380, not 6379: a native Homebrew redis-server binds 127.0.0.1:6379
      # on this machine and silently shadows the docker container for loopback
      # connections. Host-side tools (admin/workers run outside docker) must use
      # 6380; container-to-container traffic still uses redis:6379 on the compose network.
      - "6380:6379"
    volumes:
      - redis_data:/data

  # ollama runs natively on the host (Metal acceleration on Mac dev machines
  # is ~5-8x faster than CPU-only in this container per local benchmark).
  # Containers reach it via host.docker.internal. Revisit for the Linux VPS
  # deployment target, where this Mac-only rationale doesn't apply — see
  # docs/DECISIONS.md.

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/unichatbot
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  workers:
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/unichatbot
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      - postgres
      - redis

  # extractor is invoked via child_process from workers/api for the MVP,
  # not a container. Promote to an HTTP service here once tenant #2 lands
  # (see docs/ROADMAP.md "Defer until tenant #2").

volumes:
  postgres_data:
  redis_data:
